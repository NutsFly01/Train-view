<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train View</title>
  <meta name="description" content="Carte des trains SNCF en France, positions estimées à partir des horaires théoriques.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <a class="logo" href="#" title="Train View">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2c-4 0-8 .5-8 4v9.5A3.5 3.5 0 0 0 7.5 19L6 20.5v.5h2l2-2h4l2 2h2v-.5L16.5 19a3.5 3.5 0 0 0 3.5-3.5V6c0-3.5-4-4-8-4zM7.5 17a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3.5-7H6V6h5v4zm2 0V6h5v4h-5zm3.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
      <span>Train View</span>
    </a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Rechercher un train ou une gare" autocomplete="off" spellcheck="false">
      <ul id="results" class="hidden" role="listbox"></ul>
    </div>
    <div class="top-stats">
      <span><strong id="count">0</strong> trains</span>
      <span id="clock">--:--:--</span>
    </div>
  </header>

  <div id="map"></div>
  <div id="tooltip" class="hidden"></div>

  <div id="filters" class="floating"></div>

  <aside id="panel" class="hidden" aria-live="polite"></aside>

  <div id="status" class="floating hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
