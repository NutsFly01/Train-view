name: Déploiement GitHub Pages

on:
  # À chaque push : seule la branche par défaut du dépôt est déployée (voir `if` ci-dessous).
  push:
  schedule:
    # Tous les jours à 3h17 UTC : on régénère les horaires.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Voies OpenStreetMap déjà préparées (renouvelées au bout de 30 jours par osm-rail.sh).
      - uses: actions/cache@v4
        with:
          path: .cache/osm-rail
          key: osm-rail-v2-${{ github.run_id }}
          restore-keys: osm-rail-v2-
      - name: Voies OpenStreetMap (extraits Geofabrik)
        run: |
          sudo apt-get install -y -q osmium-tool
          bash scripts/osm-rail.sh
      - name: Génération des horaires
        run: npm run data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
